<?xml version="1.0" encoding="UTF-8"?>
<!--
	Пул физических звуковых событий (ТЗ "Аудиосистема")

	Секция на тип события (типы SoundEventType физики):
		File        - wav-файл относительно data/sounds
		MinVolume   - порог интенсивности события 0..1 (тише - не играть)
		MaxDistance - дистанционная отсечка, м (дальше - не играть)
		Cooldown    - минимальная пауза между пусками, с

	Секция Pool:
		MaxSources  - лимит одновременно звучащих событий (реальных
		              источников OpenAL); лишние вытесняются по
		              приоритету интенсивность/дистанция (виртуализация)

	Файлы - ближайшие по смыслу из существующей поставки data/sounds.
	Отсутствие файла НЕ ошибка: событие тихо пропускается, warning
	в asound.log выдаётся однократно.
-->
<Config>
	<Pool>
		<MaxSources>8</MaxSources>
	</Pool>

	<!-- Удар ползуна о рельс -->
	<FlatImpact>
		<File>vl60/ezda.wav</File>
		<MinVolume>0.10</MinVolume>
		<MaxDistance>400</MaxDistance>
		<Cooldown>0.20</Cooldown>
	</FlatImpact>

	<!-- Скрежет гребня о рельс -->
	<FlangeContact>
		<File>vl60/brake_scr.wav</File>
		<MinVolume>0.15</MinVolume>
		<MaxDistance>300</MaxDistance>
		<Cooldown>0.50</Cooldown>
	</FlangeContact>

	<!-- Удар в сцепке (выбор зазора) -->
	<CouplerImpact>
		<File>vl60/254-chelk.wav</File>
		<MinVolume>0.05</MinVolume>
		<MaxDistance>500</MaxDistance>
		<Cooldown>0.10</Cooldown>
	</CouplerImpact>

	<!-- Разрыв сцепки -->
	<CouplerBreak>
		<File>vl60/254_vypusk.wav</File>
		<MinVolume>0.05</MinVolume>
		<MaxDistance>800</MaxDistance>
		<Cooldown>1.00</Cooldown>
	</CouplerBreak>

	<!-- Скрежет сошедшей ПЕ о шпалы -->
	<DerailmentScrape>
		<File>freight/departure.wav</File>
		<MinVolume>0.10</MinVolume>
		<MaxDistance>1000</MaxDistance>
		<Cooldown>0.50</Cooldown>
	</DerailmentScrape>

	<!-- Дуга токоприёмника -->
	<PantographArc>
		<File>vl60/gvon.wav</File>
		<MinVolume>0.10</MinVolume>
		<MaxDistance>300</MaxDistance>
		<Cooldown>0.30</Cooldown>
	</PantographArc>

	<!-- Поток песка под колёсами -->
	<SandFlow>
		<File>vl60/compr.wav</File>
		<MinVolume>0.10</MinVolume>
		<MaxDistance>150</MaxDistance>
		<Cooldown>1.00</Cooldown>
	</SandFlow>

	<!-- Визг боксования/юза -->
	<WheelSlip>
		<File>vl60/brake_scr.wav</File>
		<MinVolume>0.15</MinVolume>
		<MaxDistance>400</MaxDistance>
		<Cooldown>0.50</Cooldown>
	</WheelSlip>

	<!-- Стук на стыке пути -->
	<JointImpact>
		<File>vl60/254-chelk.wav</File>
		<MinVolume>0.05</MinVolume>
		<MaxDistance>300</MaxDistance>
		<Cooldown>0.15</Cooldown>
	</JointImpact>

	<!-- Свист тормозных колодок -->
	<BrakeSqueal>
		<File>vl60/brake_scr.wav</File>
		<MinVolume>0.10</MinVolume>
		<MaxDistance>400</MaxDistance>
		<Cooldown>0.50</Cooldown>
	</BrakeSqueal>
</Config>
